# 稻季控释配方地图：模型参数
#
# 所有数值都是文献初值，需用实测数据替换（见 README “需要实测的数据”）。
# 注意：保留数字的写法，例如 17.0 写成浮点、7 写成整数；改动后运行 python build.py 重新计算。

# ---------------------------------------------------------------- 释放模型
[release]
Ea = 50.0          # kJ/mol，Arrhenius 表观活化能（20–30 °C 间 Q10≈2）
f_soil = 0.90      # 淹水土壤中相对 25 °C 静水的释放速率系数
f0 = 0.03          # 初期溶出比例（24 h）
beta = 1.3         # Weibull 形状参数：>1 表示有短暂滞后、中段近线性
paddy_dT = 1.0     # 田面水/表层土温 = 气温 + 1 °C

# 控释期档位（天，25 °C 静水累计释放 80% 的天数）
[products]
min = 30
max = 360
step = 10

# ---------------------------------------------------------------- 肥料氮库
[pool]
urea_tau = 2.0     # 尿素水解时间常数（天）
urea_loss = 0.15   # 基施尿素的初始损失（主要是氨挥发，混施入土的情形）
k_loss = 0.013     # 有效氮库日损失率
eta = 0.80         # 根系最大截获效率
buffer = 7         # 库中至少保有未来 7 天的需求
early_pool = 0.20  # 施肥后到幼穗分化，库中至少保有“肥料需供吸氮量”的 20%

# 产品折算
[product_n]
n_cru = 0.42       # 包膜尿素含氮量
n_urea = 0.46      # 尿素含氮量

# ---------------------------------------------------------------- 需氮模型
[demand]
min_fert_demand = 12.0   # kg N/ha：肥料需供吸氮量的下限

# 生育期推算：灌浆天数 = clip(base + (ref_T − 成熟前 35 天均温)·slope, min, max)
# 抽穗 = 成熟 − 灌浆天数；幼穗分化 = 抽穗 − pi_to_heading（不早于 pi_min）
[phenology]
gdd_base = 10.0
gdd_cap = 30.0
gfill_base = 30.0
gfill_ref_T = 24.0
gfill_slope = 2.0
gfill_min = 25
gfill_max = 45
pi_to_heading = 28
pi_min = 15

# 品种类型：nreq = 单位稻谷需氮量（kg N/t，含秸秆）；pPI、pH = 幼穗分化、抽穗时累计吸氮比例
[crop.IND]
nreq = 17.0
pPI = 0.40
pH = 0.85
label = "常规籼稻"

[crop.HYB]
nreq = 17.0
pPI = 0.35
pH = 0.78
label = "杂交籼稻"

[crop.JAP]
nreq = 19.0
pPI = 0.40
pH = 0.82
label = "温带粳稻"

[crop.TJ]
nreq = 17.0
pPI = 0.38
pH = 0.80
label = "热带粳稻/长粒型"

[crop.AROM]
nreq = 18.0
pPI = 0.35
pH = 0.80
label = "香稻/感光品种"

# 种植方式：dPI、dH = 对吸氮比例的修正；k_mult = 氮库损失率倍数
[est.TPR]
label = "移栽"
dPI = 0.0
dH = 0.0
k_mult = 1.0

[est.WSR]
label = "水直播/湿直播"
dPI = -0.08
dH = -0.03
k_mult = 1.0

[est.DSR]
label = "旱直播（晚淹水）"
dPI = -0.08
dH = -0.03
k_mult = 1.15

# ---------------------------------------------------------------- 优化
[optimize]
max_cr = 2                # 每个配方最多用几个控释期
cost_cr = 1.02            # 包膜尿素相对尿素的目标函数权重（同等效果时优先用尿素）
min_release_at_maturity = 0.30   # 成熟时释放不到 30% 的档位不参与组合
round_step = 5            # 比例取整步长（%）
min_component = 0.08      # 占比低于 8% 的组分去掉
total_step = 5            # 总氮量向上取整（kg N/ha）
single_cr_tolerance = 1.03   # 单一控释期方案多用不超过 3% 的氮时，优先选它

# ---------------------------------------------------------------- 情景与对照
[scenarios]
ea_sensitivity = [38, 65]        # 活化能敏感性（kJ/mol）
stype_beta = 2.5                 # S 型（有滞后期）产品的形状参数
robust_dT = [-1.5, 1.5]          # 年际温度波动（°C），检查基准配方是否断顿
split_fractions = [0.4, 0.3, 0.3]   # 对照：三次分施尿素（基肥、分蘖肥、穗肥）
split_tiller_before_pi = 25      # 分蘖肥在幼穗分化前多少天
split_tiller_min_day = 10        # 分蘖肥不早于施基肥后第几天
series_step = 2                  # 页面曲线的采样间隔（天）
